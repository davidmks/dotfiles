set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -s escape-time 0

set -g status-style 'bg=#333333 fg=#5eacd3'
set -g @hostname "Mana"
set -g status-right '#(~/.claude/hooks/agent-state.sh status "#{session_name}")#{@hostname} | %H:%M %a %h %d'
set -g status-right-length 80
set -g status-interval 5

# A ● after each window whose agent waits for you.
set -g @agent_waiting '#{m/r:^(blocked|done)$,#{@agent_state}}'
set -g window-status-format '#I:#W#{?window_flags,#{window_flags}#{?#{E:@agent_waiting}, ,}, }#{?#{E:@agent_waiting},●,}'
set -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}#{?#{E:@agent_waiting}, ,}, }#{?#{E:@agent_waiting},●,}'

bind r source-file ~/.tmux.conf
bind a choose-tree -Zw -f '#{@agent_state}' -F '#{?window_format,#{p8:@agent_state}#{t/p:@agent_since}  #{s/^[^ ]+ //:pane_title},#{?pane_format,#{p8:@agent_state}#{t/p:@agent_since}  #{s/^[^ ]+ //:pane_title},}}' 'run-shell "~/.claude/hooks/agent-state.sh jump %%"'
bind A run-shell '~/.claude/hooks/agent-state.sh jump'
set -g focus-events on
set-hook -g pane-focus-in "run-shell -b '~/.claude/hooks/agent-state.sh seen #{pane_id}'"
set -g base-index 1

set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000

# new window always opens at the "terminal" window's path, not the last active pane's
bind c run-shell 'tmux new-window -t "#{session_name}" -c "$(tmux display-message -p -t "#{session_name}:terminal" "#{pane_current_path}")"'